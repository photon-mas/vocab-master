@font-face{font-family:'Barlow';font-weight:500;font-style:normal;font-display:swap;src:url('barlow-500.woff2') format('woff2')}

@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url('barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url('barlow-condensed-700.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;font-style:normal;font-display:swap;src:url('newsreader-500.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;font-display:swap;src:url('newsreader-400-italic.woff2') format('woff2')}

:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --sunk:#E6EDE9; --ink:#0F1F19; --ink-2:#3B4E45; --muted:#62756C; --line:#D2DCD6; --line-2:#E3E9E5;
  --green:#0B6E4F; --green-ink:#075A40; --green-soft:#DCEFE5; --on-green:#FFFFFF;
  --red:#C9302C; --red-soft:#FBE3E0; --gold:#B7800C; --gold-soft:#F7EBCB; --blue:#2F5D8A;
  --shadow:0 1px 2px rgba(15,31,25,.06),0 10px 28px rgba(15,31,25,.07);
  --shadow-lg:0 2px 6px rgba(15,31,25,.08),0 24px 60px rgba(15,31,25,.12);
  --f-display:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-bn:'Hind Siliguri','Noto Sans Bengali','Nirmala UI','Vrinda','Shonar Bangla',sans-serif;
  --r:14px; --r-sm:10px; --maxw:1180px; --hdr:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A120F; --surface:#101B17; --sunk:#16231E; --ink:#E5EEE9; --ink-2:#B7C8BF; --muted:#8A9F95; --line:#24352E; --line-2:#1C2B25;
  --green:#3CC995; --green-ink:#74E0B8; --green-soft:#12372A; --on-green:#06130E;
  --red:#FF7B72; --red-soft:#3B1917; --gold:#F0BE4C; --gold-soft:#3A2D10; --blue:#8DB9E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A120F; --surface:#101B17; --sunk:#16231E; --ink:#E5EEE9; --ink-2:#B7C8BF; --muted:#8A9F95; --line:#24352E; --line-2:#1C2B25;
  --green:#3CC995; --green-ink:#74E0B8; --green-soft:#12372A; --on-green:#06130E;
  --red:#FF7B72; --red-soft:#3B1917; --gold:#F0BE4C; --gold-soft:#3A2D10; --blue:#8DB9E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr) + 60px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--green-ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:6px}
.bn{font-family:var(--f-bn);font-weight:500}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead ---------- */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:18px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;border-radius:12px}
.brand svg{width:36px;height:36px;flex:none;filter:drop-shadow(0 4px 10px rgba(11,110,79,.25))}
.brand b{font:700 23px/1 var(--f-cond);letter-spacing:.01em}
.brand b em{font-style:normal;color:var(--green)}
.brand small{display:block;font:600 10px/1 var(--f-cond);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;height:44px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:0 46px 0 44px;font:500 16px var(--f-body);transition:border-color .2s,box-shadow .2s,background .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--green);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 11px var(--f-cond);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;max-height:min(70vh,460px);overflow:auto;z-index:70}
.sug button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--ink)}
.sug button[aria-selected="true"],.sug button:hover{background:var(--green-soft)}
.sug .w{font:500 18px/1.2 var(--f-display)}
.sug .p{font:600 11px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.sug .d{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sug .hint{padding:10px 12px;color:var(--muted);font-size:14px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font:600 15px var(--f-cond);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;padding:8px 11px;border-radius:9px;transition:background .2s,color .2s}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--green-ink);background:var(--green-soft)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),background .2s}
.iconbtn:hover{transform:translateY(-1px);background:var(--sunk)}
.iconbtn svg{width:19px;height:19px}

/* bottom tab bar (phones) */
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .mast .wrap{gap:10px}
  .brand b{font-size:20px}.brand small{display:none}.brand svg{width:32px;height:32px}
  .search input{height:40px;font-size:15px;padding-right:14px}
  .search kbd{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font:600 11px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 0;border-radius:10px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--green-ink)}
  main{padding-bottom:84px}
}

@media (max-width:400px){.brand .wm{display:none}}

/* ---------- generic ---------- */
main{min-height:70vh}
.view{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px/1.2 var(--f-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.h1{font:500 clamp(34px,5.4vw,56px)/1.04 var(--f-display);letter-spacing:-.01em;margin:6px 0 10px;text-wrap:balance}
.h2{font:700 26px/1.1 var(--f-cond);letter-spacing:.01em;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font:600 15px var(--f-body);text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--green);color:var(--on-green);box-shadow:0 8px 20px color-mix(in srgb,var(--green) 28%,transparent)}
.btn.pri:hover{transform:translateY(-2px)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:34px;padding:0 13px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 12.5px var(--f-cond);letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--ink-2);text-decoration:none;border:0}
a.pill:hover,button.pill:hover{background:var(--green-soft);color:var(--green-ink)}
.pill.g{background:var(--green-soft);color:var(--green-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.muted{color:var(--muted)}
.sep{height:1px;background:var(--line);border:0;margin:22px 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s var(--ease);z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}

/* ---------- home ---------- */
.hero{position:relative;padding-block:34px 18px}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:22px;align-items:stretch}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.wotd{position:relative;overflow:hidden;padding:28px 28px 24px;min-width:0}
.wotd .date{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wotd .date time{font:600 13px var(--f-cond);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.word-xl{font:500 clamp(48px,8.4vw,92px)/.98 var(--f-display);letter-spacing:-.02em;margin:14px 0 4px;word-break:break-word}
.word-xl span{display:inline-block;animation:drop .7s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-22px) rotate(-4deg)}to{opacity:1;transform:none}}
.beam{display:block;width:min(100%,520px);height:34px;margin:2px 0 6px;color:var(--green)}
.beam .ln{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.3s .35s var(--ease) forwards}
.beam .sp{opacity:0;animation:fade .4s 1.2s forwards}
.beam .ld{opacity:0;animation:load 1.6s 1.5s var(--ease) infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes load{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}70%{opacity:1;transform:translateY(2px)}100%{opacity:0;transform:translateY(2px)}}
.prn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:17px}
.prn .rs{font-weight:500}
.prn .rs b{color:var(--ink);font-weight:700}
.prn .ipa{color:var(--muted);font-family:'Charis SIL','Doulos SIL','Gentium Plus','Lucida Sans Unicode','Segoe UI',sans-serif;font-size:16px}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--green-ink);transition:transform .2s var(--ease),background .2s}
.say:hover{transform:scale(1.08);background:var(--green-soft)}
.say svg{width:18px;height:18px}
.say.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--green) 18%,transparent)}}
.posl{font:700 13px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.def{font-size:19px;line-height:1.5;margin:8px 0 6px;max-width:60ch}
.bnline{display:flex;gap:8px;align-items:baseline;color:var(--ink-2);margin:4px 0}
.bnline .tag{font:500 13px var(--f-bn);color:var(--muted)}
.bnline .bn{font-size:17px;color:var(--ink)}
.netcard{position:relative;min-height:340px;overflow:hidden;padding:0;display:flex;flex-direction:column;min-width:0}
.netcard .cap{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:2}
.netcard canvas{display:block;width:100%;flex:1;min-height:320px;touch-action:manipulation}
.legend{position:absolute;left:18px;bottom:14px;display:flex;gap:14px;font:600 12px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:2;pointer-events:none;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stats div{padding:16px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font:700 30px/1 var(--f-cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats span{font-size:13.5px;color:var(--muted)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.section{padding-block:26px 6px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lists{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lcard{display:flex;flex-direction:column;gap:8px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;min-width:0}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.lcard .top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.lcard h3{margin:0;font:700 20px/1.15 var(--f-cond);letter-spacing:.01em}
.lcard .n{font:700 22px/1 var(--f-cond);color:var(--green-ink);font-variant-numeric:tabular-nums}
.lcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:6px;transition:width .6s var(--ease)}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.games{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gcard{padding:18px;text-decoration:none;color:var(--ink);display:flex;gap:14px;align-items:center;transition:transform .25s var(--ease),box-shadow .25s}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.gcard .gi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--green-soft);color:var(--green-ink)}
.gcard .gi svg{width:26px;height:26px}
.gcard h3{margin:0;font:700 19px/1.1 var(--f-cond)}
.gcard p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.35}

/* ---------- entry ---------- */
.entry-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;padding-block:22px 30px;align-items:start}
@media (max-width:980px){.entry-layout{grid-template-columns:minmax(0,1fr)}}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:30;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -2px 18px;padding:0 2px}
.secnav .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.secnav .in::-webkit-scrollbar{display:none}
.secnav a{flex:none;font:600 14.5px var(--f-cond);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.secnav a:hover{color:var(--ink)}
.secnav a.on{color:var(--green-ink);border-color:var(--green)}
.head{padding:4px 0 6px}
.head .crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.head h1{font:500 clamp(46px,8vw,78px)/1 var(--f-display);letter-spacing:-.02em;margin:10px 0 2px;word-break:break-word}
.head h1 span{display:inline-block;animation:drop .6s var(--ease) both}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.senses{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin:18px 0 6px;scrollbar-width:thin}
.sense{flex:none;max-width:280px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.sense:hover{transform:translateY(-1px);border-color:var(--green)}
.sense[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.sense .p{display:block;font:700 11.5px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sense .l{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block{padding:22px 24px;margin-top:16px}
.block h2{font:700 24px/1.1 var(--f-cond);margin:0 0 4px;letter-spacing:.01em}
.block .sub{color:var(--muted);font-size:14px;margin:0 0 6px}
.tier{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.tier:first-of-type{border-top:0}
.tier .lab{flex:none;width:94px;font:700 12px var(--f-cond);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-top:7px}
.tier .chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
@media (max-width:560px){.tier{flex-direction:column;gap:6px}.tier .lab{width:auto;padding-top:0}.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;font:500 15.5px var(--f-body);text-decoration:none;border:1.5px solid transparent;transition:transform .18s var(--ease),box-shadow .18s,background .18s;animation:pop .4s var(--ease) both;white-space:nowrap}
.chip:hover{transform:translateY(-2px)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.chip.s1{background:var(--green);color:var(--on-green);font-weight:600}
.chip.s1:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--green) 35%,transparent)}
.chip.s2{background:var(--green-soft);color:var(--green-ink);font-weight:600}
.chip.s3{background:transparent;border-color:var(--line);color:var(--ink-2)}
.chip.s3:hover{border-color:var(--green);color:var(--green-ink)}
.chip.a1{background:var(--red);color:#fff;font-weight:600}
.chip.a2{background:transparent;border-color:color-mix(in srgb,var(--red) 45%,var(--line));color:var(--red)}
:root[data-theme="dark"] .chip.a1{color:#1a0807}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.a1{color:#1a0807}}
.chip.r{background:var(--sunk);color:var(--ink-2)}
.chip.r:hover{background:var(--green-soft);color:var(--green-ink)}
.chip.off{border-style:dashed}
.usage{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px;color:var(--ink-2);font-size:15px}
.usage .tag{font:700 11px var(--f-cond);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ex{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;counter-reset:ex}
.ex li{position:relative;padding:12px 16px 12px 50px;border-radius:12px;background:var(--paper);border:1px solid var(--line-2);font:400 18px/1.5 var(--f-display);counter-increment:ex}
.ex li::before{content:counter(ex);position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);font:700 13px/24px var(--f-cond);text-align:center}
.ex li mark{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--gold) 38%,transparent) 58%);color:inherit;font-style:italic;padding:0 1px}
.ex .src{display:block;margin-top:4px;font:500 12.5px var(--f-body);color:var(--muted)}
mark{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--gold) 38%,transparent) 58%);color:inherit;padding:0 1px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.inlists{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:8px}
.inlists a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--paper);transition:border-color .2s,transform .2s var(--ease)}
.inlists a:hover{border-color:var(--green);transform:translateY(-2px)}
.inlists b{display:block;font:700 18px/1.2 var(--f-cond)}
.inlists span{font-size:13.5px;color:var(--muted)}
.defs{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.defs li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.defs .num{font:700 15px/1.6 var(--f-cond);color:var(--green-ink)}
.defs .gl{font-size:16.5px}
.defs .syn{font-size:14px;color:var(--muted)}
.defs .syn a{color:var(--ink-2)}
.defs .wx{display:block;font:italic 400 16px var(--f-display);color:var(--ink-2)}
.aside{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 16px)}
@media (max-width:980px){.aside{position:static}}
.mini{padding:18px}
.mini h3{margin:0 0 8px;font:700 13px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mini .w{font:500 34px/1.05 var(--f-display);margin:2px 0;display:block;color:var(--ink);text-decoration:none}
.mini .w:hover{color:var(--green-ink)}
.mini p{margin:4px 0 12px;color:var(--ink-2);font-size:15px}
.mini canvas{width:100%;height:240px;display:block}
.status{display:flex;gap:8px;flex-wrap:wrap}
.status button{flex:1;min-width:110px}
.status button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.lite-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:14.5px;margin-top:14px}

/* ---------- lists ---------- */
.list-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap;padding-block:26px 6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 13px;font:600 13.5px var(--f-cond);letter-spacing:.05em;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.az{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0}
.az a{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;font:700 14px var(--f-cond);text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.az a:hover{background:var(--green-soft);color:var(--green-ink)}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.wl a{display:block;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0;transition:border-color .2s,transform .2s var(--ease)}
.wl a:hover{border-color:var(--green);transform:translateY(-2px)}
.wl .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wl .w{font:500 21px/1.2 var(--f-display)}
.wl .p{font:700 11px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);flex:none}
.wl .d{font-size:14px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wl .b{font-size:14px;color:var(--muted);margin-top:3px}
.wl .k{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
.wl .k.l1{background:var(--gold)}.wl .k.l2{background:var(--green)}
.letter{font:700 26px var(--f-cond);margin:22px 0 4px;color:var(--green-ink);scroll-margin-top:140px}

/* ---------- study ---------- */
.study{max-width:760px;margin:0 auto;padding-block:26px 30px}
.setup{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:16px 0}
@media (max-width:560px){.setup{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font:700 12px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field select,.field textarea,.field input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 15.5px var(--f-body)}
.field textarea{min-height:160px;resize:vertical;line-height:1.5}
.flash{perspective:1400px;margin:18px 0}
.flash .inner{position:relative;height:340px;transition:transform .7s var(--ease);transform-style:preserve-3d;cursor:pointer}
.flash.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden}
.face.back{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:flex-start;overflow:auto}
.face .prn{justify-content:center}
.face .big{font:500 clamp(40px,8vw,64px)/1 var(--f-display);word-break:break-word}
.face .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:600 12px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.face.back .def{font-size:18px;margin:4px 0}
.face.back .exs{font:italic 400 16.5px/1.45 var(--f-display);color:var(--ink-2);margin-top:8px}
.prog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.prog .meter{flex:1}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer .btn{height:50px}
.btn.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.good{background:var(--green);color:var(--on-green)}
.q{font:500 clamp(22px,3.4vw,28px)/1.35 var(--f-display);margin:16px 0}
.q mark{background:none;color:var(--green-ink);border-bottom:2px dashed var(--green)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:500 17px var(--f-body);transition:border-color .2s,transform .2s var(--ease),background .2s}
.opt:hover:not([disabled]){border-color:var(--green);transform:translateX(3px)}
.opt .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 14px var(--f-cond);background:var(--sunk);color:var(--muted);flex:none}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .k{background:var(--green);color:var(--on-green)}
.opt.no{border-color:var(--red);background:var(--red-soft);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result{text-align:center;padding:28px 20px}
.ring{width:150px;height:150px;margin:0 auto 10px;display:block}
.ring .bg{stroke:var(--sunk)}.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring text{fill:var(--ink);font:700 34px var(--f-cond)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:560px){.match{gap:8px}}
.tile{min-height:70px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:14.5px;line-height:1.35;transition:transform .2s var(--ease),border-color .2s,background .2s,opacity .3s}
.tile.w{font:500 20px/1.15 var(--f-display);text-align:center}
.tile.sel{border-color:var(--green);background:var(--green-soft);transform:scale(1.02)}
.tile.done{opacity:.25;pointer-events:none;transform:scale(.97)}
.tile.err{border-color:var(--red);background:var(--red-soft);animation:shake .4s}
.wheel-wrap{position:relative;width:min(100%,460px);aspect-ratio:1;margin:12px auto}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-wrap .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--red);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));z-index:2}
.wheel-wrap .hub{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--surface);border:4px solid var(--green);display:grid;place-items:center;font:700 16px var(--f-cond);letter-spacing:.06em;color:var(--green-ink);box-shadow:var(--shadow)}
.spin-res{text-align:center;min-height:120px}

/* ---------- about ---------- */
.about{padding-block:26px 30px;display:grid;gap:18px}
.profile{overflow:hidden;padding:0}
.cover{position:relative;height:clamp(190px,34vw,360px);background:var(--sunk)}
.cover .cv{width:100%;height:100%;object-fit:cover;object-position:28% 42%;display:block}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.28))}
.pfp{position:absolute;right:clamp(16px,4vw,40px);bottom:calc(-1 * clamp(44px,7vw,64px));width:clamp(96px,15vw,140px);height:clamp(96px,15vw,140px);border-radius:50%;object-fit:cover;border:5px solid var(--surface);box-shadow:var(--shadow-lg);z-index:2;background:var(--surface)}
.pinfo{padding:18px 24px 24px;padding-right:clamp(120px,20vw,200px)}
@media (max-width:560px){.pinfo{padding-right:24px;padding-top:58px}}
.pinfo h2{font:500 clamp(30px,4.6vw,42px)/1.05 var(--f-display);margin:0}
.pinfo .role{color:var(--ink-2);margin:6px 0 10px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.app{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),border-color .2s}
.app:hover{transform:translateY(-2px);border-color:var(--green)}
.app .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-ink);flex:none;font:700 15px var(--f-cond)}
.app b{display:block;font:700 18px/1.15 var(--f-cond)}
.app span{font-size:13.5px;color:var(--muted)}
.dua{text-align:center;font:italic 400 20px/1.4 var(--f-display);color:var(--gold);margin:6px 0}
.credits{font-size:14.5px;color:var(--ink-2)}
.credits li{margin:4px 0}

footer.foot{border-top:1px solid var(--line);margin-top:30px;padding-block:26px 30px;color:var(--muted);font-size:14px;background:var(--surface)}
footer.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer.foot em{font-style:italic;color:var(--gold);font-family:var(--f-display);font-size:16px}
footer.foot a{color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.beam .ln{stroke-dashoffset:0}.beam .sp,.beam .ld{opacity:1}}

(function(){

var S={saved:[],hist:[],srs:{},days:{},pref:{list:'hf',accent:'en-US',mode:'mix'},custom:[]};
try{var raw=localStorage.getItem('vm2');if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}

try{var th=localStorage.getItem('vm2-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}

  index:function(d){

/* ---------- synonym network (canvas) ---------- */
function Net(canvas,e,opts){
  opts=opts||{};

  var css=getComputedStyle(document.documentElement);

  var C={};
  function colors(){css=getComputedStyle(document.documentElement);C={g:col('--green'),gi:col('--green-ink'),gs:col('--green-soft'),r:col('--red'),ink:col('--ink'),mut:col('--muted'),line:col('--line'),sf:col('--surface'),gold:col('--gold'),on:col('--on-green')}}

    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    var top=opts.small?6:44,bot=opts.small?6:36;
    var cx=W/2,cy=top+(H-top-bot)*.5,rx1=W*.27,ry1=(H-top-bot)*.30,rx2=W*.40,ry2=(H-top-bot)*.44;
    nodes=[{w:e.w,x:cx,y:cy,t:0,ph:0}];
    var a0=-Math.PI*1.05,a1=Math.PI*.05;
    S1.forEach(function(w,i){var a=a0+(a1-a0)*(S1.length>1?i/(S1.length-1):.5);nodes.push({w:w,x:cx+Math.cos(a)*rx1,y:cy+Math.sin(a)*ry1,t:1,ph:i*1.3})});
    S2.forEach(function(w,i){var a=-Math.PI*1.12+(Math.PI*1.24)*(S2.length>1?i/(S2.length-1):.5)+(i%2?.08:-.08);nodes.push({w:w,x:cx+Math.cos(a)*rx2,y:cy+Math.sin(a)*ry2,t:2,ph:i*.9+.4})});
    A.forEach(function(w,i){var a=Math.PI*.3+(Math.PI*.4)*(A.length>1?i/(A.length-1):.5);nodes.push({w:w,x:cx+Math.cos(a)*rx2*.92,y:cy+Math.sin(a)*ry2*.95,t:3,ph:i*1.7})});
    // measure label boxes, then push overlapping labels apart and keep them inside the canvas
    nodes.forEach(function(n){var f=fnt(n);ctx.font=f[0];var txt=n.w.length>18?n.w.slice(0,17)+'…':n.w;n.bw=ctx.measureText(txt).width+(n.t===0?28:18);n.bh=f[1]+(n.t===0?16:11)});
    for(var it=0;it<120;it++){
      var moved=false;
      for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
        var P=nodes[i],Q=nodes[j],dx=Q.x-P.x,dy=Q.y-P.y,ox=(P.bw+Q.bw)/2+8-Math.abs(dx),oy=(P.bh+Q.bh)/2+6-Math.abs(dy);
        if(ox>0&&oy>0){moved=true;
          if(ox*.6<oy){var sx=(dx>=0?1:-1)*ox/2;if(i===0)Q.x+=2*sx;else{P.x-=sx;Q.x+=sx}}
          else{var sy=(dy>=0?1:-1)*oy/2;if(i===0)Q.y+=2*sy;else{P.y-=sy;Q.y+=sy}}}
      }
      nodes.forEach(function(n,k){if(!k)return;n.x=Math.max(n.bw/2+6,Math.min(W-n.bw/2-6,n.x));n.y=Math.max(top+n.bh/2,Math.min(H-bot-n.bh/2,n.y))});
      if(!moved)break;
    }
  }
  function pos(n,t){
    var k=reduce?1:Math.min(1,(t-t0)/900),ease=1-Math.pow(1-k,3);
    var c=nodes[0],dx=reduce?0:Math.sin(t/1400+n.ph)*2.5,dy=reduce?0:Math.cos(t/1700+n.ph)*2;

  }
  function label(n,p){
    var f=fnt(n),fs=f[1];ctx.font=f[0];

    var x=p.x-tw/2-ph,y=p.y-hh/2,w=tw+ph*2;

    var bg=n.t===0?C.g:n.t===1?C.gs:n.t===3?C.sf:C.sf,fg=n.t===0?C.on:n.t===1?C.gi:n.t===3?C.r:C.mut;

  canvas.addEventListener('mousemove',function(ev){var h=hit(ev);if(h!==hover){hover=h;canvas.style.cursor=h>0?'pointer':'default';if(reduce)draw(performance.now())}});

}

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var prev=p[0];p[0]=i;for(j=1;j<=b.length;j++){var t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return p[b.length]}
function fuzzy(q,n){
  q=q.toLowerCase();var out=[];
  for(var i=0;i<ALL.length;i++){var w=ALL[i];if(w[0]!==q[0]&&w.slice(0,2)!==q.slice(0,2))continue;var d=lev(q,w);if(d<=2)out.push([d,CORE[w]!==undefined?0:1,w])}
  out.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]||a[2].length-b[2].length});
  return out.slice(0,n||8).map(function(x){return x[2]});
}

var q=$('#q'),sug=$('#sug'),sel=-1,items=[];
function lower(a,x){var lo=0,hi=a.length;while(lo<hi){var m=(lo+hi)>>1;if(a[m]<x)lo=m+1;else hi=m}return lo}
function suggest(v){
  v=v.trim().toLowerCase();if(!v||!IDX){hideSug();return}
  var i=lower(ALL,v),res=[];
  while(i<ALL.length&&ALL[i].indexOf(v)===0&&res.length<60){res.push(ALL[i]);i++}
  res.sort(function(a,b){if(a===v)return -1;if(b===v)return 1;var ca=CORE[a]!==undefined?0:1,cb=CORE[b]!==undefined?0:1;return ca-cb||a.length-b.length||(a<b?-1:1)});
  res=res.slice(0,8);var fz=false;
  if(!res.length){res=fuzzy(v,6);fz=true}
  items=res;sel=res.length?0:-1;
  sug.innerHTML=(fz&&res.length?'<div class="hint">No exact match. Closest spellings:</div>':'')+
   (res.length?res.map(function(w,k){var c=core(w);return '<button type="button" role="option" data-w="'+esc(w)+'" aria-selected="'+(k===sel)+'"><span class="w">'+esc(w)+'</span>'+(c?'<span class="p">'+esc(c[1])+'</span><span class="d">'+esc(c[2])+'</span>':'<span class="d">thesaurus entry</span>')+'</button>'}).join(''):'<div class="hint">No match for “'+esc(v)+'”. Press Enter to see suggestions.</div>');
  sug.hidden=false;q.setAttribute('aria-expanded','true');
}
function hideSug(){sug.hidden=true;q.setAttribute('aria-expanded','false')}
function go(w){hideSug();q.value='';q.blur();location.hash=href(w)}
q.addEventListener('input',function(){READY.then(function(){suggest(q.value)})});
q.addEventListener('focus',function(){if(q.value)suggest(q.value)});
q.addEventListener('keydown',function(ev){
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){if(!items.length)return;ev.preventDefault();sel=(sel+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length;$$('button',sug).forEach(function(b,k){b.setAttribute('aria-selected',k===sel)})}
  else if(ev.key==='Enter'){ev.preventDefault();var v=q.value.trim().toLowerCase();if(!v)return;if(has(v))go(v);else if(sel>-1&&items[sel])go(items[sel]);else go(v)}
  else if(ev.key==='Escape'){hideSug();q.blur()}
});

var FORMS_IRR={be:'was were been',go:'went gone',come:'came',take:'took taken',give:'gave given',get:'got',make:'made',see:'saw seen',run:'ran',write:'wrote written',break:'broke broken',choose:'chose chosen',speak:'spoke spoken',arise:'arose arisen',shine:'shone',creep:'crept',forswear:'forswore forsworn',uphold:'upheld',partake:'partook partaken',undo:'undid undone',overtake:'overtook overtaken',mete:'meted',seek:'sought',teach:'taught',think:'thought',buy:'bought',bring:'brought',catch:'caught',fight:'fought',leave:'left',lose:'lost',feel:'felt',keep:'kept',sleep:'slept',sell:'sold',tell:'told',find:'found',hold:'held',stand:'stood',understand:'understood',withdraw:'withdrew withdrawn',undergo:'underwent undergone',undertake:'undertook undertaken',forgo:'forwent forgone',forsake:'forsook forsaken',beget:'begot begotten',slay:'slew slain'};
function blankOut(sent,w){
  var base=w.toLowerCase().split(' ')[0],cands=[base];
  var st=base.replace(/(e|y)$/,'');
  var irr=(FORMS_IRR[base]||'').split(' ').filter(Boolean);
  var re=new RegExp('\\b('+[base,st+'[a-z]{0,4}'].concat(irr).map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')\\b','i');
  if(!re.test(sent))return null;
  return esc(sent).replace(re,'<mark>________</mark>');
}

    var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),W=r.width;cv.width=W*dpr;cv.height=W*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var cx=W/2,R=W/2-6,n=words.length,seg=2*Math.PI/n,cols=[cssv('--green'),cssv('--green-soft'),cssv('--gold-soft'),cssv('--surface')];
    for(var i=0;i<n;i++){var a=ang+i*seg-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cx);ctx.arc(cx,cx,R,a,a+seg);ctx.closePath();ctx.fillStyle=cols[i%4];ctx.fill();ctx.strokeStyle=cssv('--line');ctx.lineWidth=1;ctx.stroke();
      var mid=a+seg/2,flip=Math.cos(mid)<0;ctx.save();ctx.translate(cx,cx);ctx.rotate(flip?mid+Math.PI:mid);ctx.textAlign=flip?'left':'right';ctx.textBaseline='middle';ctx.fillStyle=i%4===0?cssv('--on-green'):cssv('--ink');ctx.font='600 '+Math.max(11,Math.min(17,W/28))+'px Barlow, system-ui, sans-serif';var t=words[i].length>16?words[i].slice(0,15)+'…':words[i];ctx.fillText(t,flip?-(R-14):R-14,0);ctx.restore()}
    ctx.beginPath();ctx.arc(cx,cx,R,0,2*Math.PI);ctx.lineWidth=6;ctx.strokeStyle=cssv('--green');ctx.stroke();
  }
  draw();var ro=window.ResizeObserver?new ResizeObserver(draw):null;if(ro)ro.observe(cv);
  ANIMS.push({stop:function(){cancelAnimationFrame(raf);ro&&ro.disconnect()}});
  function spin(){
    if(spinning)return;spinning=true;$('#sr').innerHTML='';
    var n=words.length,seg=2*Math.PI/n,target=Math.floor(Math.random()*n);
    var end=-(target*seg+seg/2)+2*Math.PI*(5+Math.floor(Math.random()*3)),start=ang%(2*Math.PI),dur=reduce?10:4200,t0=performance.now();
    function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);ang=start+(end-start)*e;draw();if(k<1)raf=requestAnimationFrame(step);else{spinning=false;result(words[target])}}
    raf=requestAnimationFrame(step);
  }
  function result(w){getEntry(w).then(function(e){if(!e)return;$('#sr').innerHTML='<div class="card pad" style="text-align:left;animation:enter .5s var(--ease) both"><span class="posl">'+esc(e.pos)+'</span><div class="word-xl" style="font-size:clamp(40px,7vw,64px);margin:6px 0">'+letters(e.w)+'</div>'+prLine(e)+'<p class="def">'+esc(e.d)+'</p><div class="bnline"><span class="tag">বাংলা</span><span class="bn">'+esc(e.bn||'')+'</span></div><p style="font:italic 400 17px var(--f-display);color:var(--ink-2)">“'+highlight(e.ex[0]||'',e.w)+'”</p><div class="row"><a class="btn pri sm" href="'+href(e.w)+'">Open entry '+IC.arrow+'</a><button class="btn sec sm" type="button" id="again">Spin again</button></div></div>';$('#again').onclick=spin})}
  $('#spinBtn').onclick=spin;$('.hub').onclick=spin;
}
